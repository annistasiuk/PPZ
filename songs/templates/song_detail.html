{% extends 'base.html' %}

{% block content %}
    <h2>Заголовок: {{ song.title }}</h2>
    <p>Артист: {{ song.artist }}</p>
    <p>Альбом: {{ song.album }}</p>
    <p>Жанр: {{ song.genre }}</p>
    <p>Дата випуску: {{ song.release_date }}</p>
    <hr>
    <h3>Додати до плейлиста:</h3>
    <form action="{% url 'songs:add_song_to_playlist' song.id %}" method="post">
        {% csrf_token %}
        <label for="playlist">Виберіть плейлист:</label>
        <select name="playlist" id="playlist" class="form-control">
            {% for playlist in playlists %}
                <option value="{{ playlist.id }}">{{ playlist.name }}</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn btn-primary mt-3">Додати</button>
    </form>
{% endblock %}
